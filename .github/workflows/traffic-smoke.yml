# The Traffic smoke gate, run in CI.
#
# Traffic/pw_test.js is the only thing that proves the game actually boots:
# every entry page with zero console errors, three.js and all loaders resolving
# locally, levels registered, and the no-base64-in-JS startup payload
# invariant. It previously only ran by hand, so a change could break boot and
# still merge — this workflow makes it a required signal.
#
# Playwright is declared in the ROOT package.json on purpose. Adding it to
# Traffic/package.json as well would duplicate the dependency and force a
# second ~150 MB browser download for a package that is already installed to
# run this gate. `require('playwright')` resolves upward from Traffic/ to the
# root node_modules, which is how pw_test.js has always found it.

name: Traffic Smoke

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Traffic/**'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/traffic-smoke.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'Traffic/**'
      - 'build.js'
      - 'package.json'
      - '.github/workflows/traffic-smoke.yml'
  workflow_dispatch:

concurrency:
  group: traffic-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Boot + payload gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Chromium needs a GPU-less sandbox setup in CI; the gate only asserts
      # that a canvas is created and THREE is live, so SwiftShader is fine.
      - name: Run the smoke gate
        run: npm run test:smoke

      # Guards the specific regression this gate exists for: assets drifting back
      # into JS as base64, or a stub pointing at a file that is not there.
      # Dependency-free, so it needs no install step of its own.
      - name: Startup stubs stay small, base64-free and resolvable
        run: node Traffic/tools/check-startup-stubs.js
