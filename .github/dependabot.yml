version: 2
updates:
  - package-ecosystem: npm
    directory: /
    exclude:
      - '.agents/**'
      - 'Traffic/.agents/**'
      - 'dist/**'
      - 'Traffic/dist/**'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-runtime:
        patterns:
          - '@vercel/*'
      root-build-and-quality:
        patterns:
          - 'esbuild'
          - 'eslint'
          - 'prettier'
          - 'typescript'

  - package-ecosystem: npm
    directory: /Traffic
    exclude:
      - '.agents/**'
      - 'dist/**'
      - 'dist-web/**'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      traffic-runtime:
        patterns:
          - '@dimforge/*'
          - 'howler'
          - 'three'
          - 'zustand'
      traffic-build-and-electron:
        patterns:
          - 'electron'
          - 'electron-builder'
          - 'electron-updater'
          - 'vite'
          - 'typescript'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
