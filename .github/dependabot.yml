version: 2
updates:
  # Root application dependencies. Dependabot is given exact directories rather
  # than `/` so it cannot discover the nested package manifests that ship with
  # local agent skill libraries under `.agents/`.
  - package-ecosystem: npm
    directories:
      - '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-runtime:
        patterns:
          - '@vercel/*'
      root-build-and-quality:
        patterns:
          - 'esbuild'
          - 'eslint'
          - 'prettier'
          - 'typescript'
          - 'react'
          - 'react-dom'
          - 'three'
          - 'playwright'
          - 'acorn'
          - '@types/*'

  - package-ecosystem: npm
    directories:
      - '/Traffic'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      traffic-runtime:
        patterns:
          - '@dimforge/*'
          - 'howler'
          - 'three'
          - 'zustand'
      traffic-build-and-electron:
        patterns:
          - 'electron'
          - 'electron-builder'
          - 'electron-updater'
          - 'vite'
          - 'typescript'

  - package-ecosystem: github-actions
    directories:
      - '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
