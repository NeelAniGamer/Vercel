<body class="bg-[#0b1020] m-0 overflow-hidden text-white">
<div class="loader col-skeleton-screen sk-theme-sky sk-force-dark" id="loader" role="status" aria-busy="true" aria-label="Loading Driving Simulator React Mode">
  <div class="sk-ambient-glow" aria-hidden="true"></div>
  <div class="sk-ambient-glow-left" aria-hidden="true"></div>
    <div class="sk-traffic-topbar" aria-hidden="true">
    <div class="sk-pill sk-shimmer-accent" style="width: 180px; height: 18px;"></div>
    <div style="display:flex;gap:8px;"><div class="sk-pill sk-shimmer" style="width:82px;height:26px;"></div><div class="sk-pill sk-shimmer" style="width:82px;height:26px;"></div></div>
  </div>
  <div class="sk-workspace-2col" aria-hidden="true" style="grid-template-columns: minmax(0, 1fr) 280px;">
    <div class="sk-app-stage" style="min-height: 440px; margin-bottom: 0;">
      <div class="sk-road-lane" style="height: 55%;"></div>
    </div>
    <aside class="sk-sidebar" style="display:flex;">
      <div class="sk-card"><div class="sk-pill sk-shimmer-accent" style="width:120px;height:16px;"></div><div class="sk-lede-line sk-shimmer" style="width:90%;"></div><div class="sk-lede-line sk-shimmer" style="width:76%;"></div></div>
      <div class="sk-card"><div class="sk-pill sk-shimmer" style="width:110px;height:16px;"></div><div class="sk-box sk-shimmer" style="width:100%;height:78px;"></div></div>
    </aside>
  </div>
  <footer class="sk-status-dock" aria-hidden="true">
    <div class="sk-status-pill">
      <span class="sk-pulse-live"></span>
      <span class="sk-status-text"><span>Traffic</span> &middot; React Engine Mode</span>
      <div class="sk-progress-bar"><div class="sk-progress-fill"></div></div>
    </div>
  </footer>
</div>

  <!-- React will mount into this div (bundle built to dist/ by node build.js;
       root serves Driving.html until then) -->
  <div id="root">
    <div style="display:flex;height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:sans-serif;text-align:center;padding:24px;">
      <h1>React Simulator Builds At Deploy Time</h1>
      <p>The bundled app ships in <code>dist/Traffic/simulator-bundle.js</code>. Play the live build:</p>
      <a href="Driving.html" style="padding:12px 28px;border-radius:12px;background:#f2b84b;color:#000;font-weight:800;text-decoration:none;">Play Driving Simulator</a>
    </div>
  </div>

  <!-- Load the bundled React app (present in dist/ after build; 404-safe in root) -->
  <script>fetch('simulator-bundle.js',{method:'HEAD'}).then(function(r){if(r.ok){var s=document.createElement('script');s.type='module';s.src='simulator-bundle.js';document.body.appendChild(s);var fb=document.getElementById('root');}}).catch(function(){});</script>
  <script src="welcome-back.js"></script>
  <script defer src="../col-ui.js"></script>
</body>
</html>
