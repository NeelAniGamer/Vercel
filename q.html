  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const params = new URLSearchParams(window.location.search);
      let code = params.get('id') || params.get('code');
      if (!code) {
        const pathParts = window.location.pathname.split('/');
        const lastPart = pathParts.pop() || pathParts.pop();
        if (lastPart && lastPart !== 'q.html' && lastPart !== 'q' && lastPart !== 'qr') {
          code = lastPart;
        }
      }

      const app = document.getElementById('app');
      const loaderEl = document.getElementById('loader');
      const hideLoader = () => { if (loaderEl) loaderEl.style.display = 'none'; };

      function renderError(svgIcon, title, message) {
        hideLoader();
        app.innerHTML = `
          <div class="brand-eyebrow">CraftQR</div>
          <div class="icon-container err">${svgIcon}</div>
          <div class="title">${title}</div>
          <div class="msg">${message}</div>
          <div class="stack">
            <a href="qr-editor" class="btn btn-primary">Create a Free QR Code</a>
            <a href="/" class="btn btn-secondary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Return to Home
            </a>
          </div>
        `;
      }

      const ICONS = {
        missing: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
        notFound: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        expired: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        locked: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
        warning: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
      };

      if (!code) {
        renderError(ICONS.missing, 'Missing QR Code', 'No destination or QR code identifier was provided.');
        return;
      }

      if (typeof DYNAMIC_QR !== 'undefined' && DYNAMIC_QR.ready) {
        await DYNAMIC_QR.ready;
      }

      let sbClient = null;
      try {
        let cfg = {};
        for (const u of ['config.json', '/config.json']) {
          try { const r = await fetch(u); if (r.ok) { cfg = await r.json(); break; } } catch (e) {}
        }
        if (cfg.auth && cfg.auth.url && typeof window.supabase !== 'undefined') {
          sbClient = window.supabase.createClient(cfg.auth.url, cfg.auth.key);
        }
      } catch (e) {}

      try {
        let entry = null, fromCloud = false;

        if (sbClient) {
          try {
            const { data } = await sbClient.rpc('lookup_dynamic_qr', { p_code: code });
            if (data && data.found) {
              entry = {
                id: data.id,
                shortCode: data.short_code,
                title: data.title,
                type: data.type,
                destination: data.destination_url,
                isDynamic: data.is_dynamic,
                isPasswordProtected: data.is_password_protected,
                isExpired: data.is_expired,
                scansCount: data.scans_count
              };
              fromCloud = true;
            }
          } catch (rpcErr) {
            console.warn('Supabase lookup_dynamic_qr error:', rpcErr);
          }
        }

        if (!entry && typeof DYNAMIC_QR !== 'undefined') {
          entry = DYNAMIC_QR.getByCode(code);
        }

        if (!entry) {
          try {
            const list = (typeof ColCookie !== 'undefined' ? ColCookie.get('qrs_min') : null) || (localStorage.getItem('qrs_min') ? JSON.parse(localStorage.getItem('qrs_min')) : null);
            if (list && Array.isArray(list)) {
              entry = list.find(q => q.shortCode === code || String(q.id) === String(code));
            }
          } catch (e) {}
        }

        if (!entry) {
          renderError(ICONS.notFound, 'QR Code Not Found', 'This dynamic QR code may have been deleted or does not exist.');
          return;
        }

        if (entry.paused) {
          renderError(ICONS.warning, 'Campaign Paused', 'This dynamic QR campaign is temporarily paused by its owner.');
          return;
        }

        if (entry.isExpired || (entry.expiry && new Date(entry.expiry) < new Date())) {
          renderError(ICONS.expired, 'QR Code Expired', 'This dynamic campaign link has reached its expiration date.');
          return;
        }

        if (entry.schedule) {
          const now = new Date();
          if (entry.schedule.start && new Date(entry.schedule.start) > now) {
            renderError(ICONS.expired, 'Upcoming Campaign', `This QR code will activate on ${new Date(entry.schedule.start).toLocaleDateString()}.`);
            return;
          }
          if (entry.schedule.end && new Date(entry.schedule.end) < now) {
            renderError(ICONS.expired, 'Campaign Ended', `This campaign concluded on ${new Date(entry.schedule.end).toLocaleDateString()}.`);
            return;
          }
        }

        const UA = navigator.userAgent;
        const meta = {
          p_user_agent: UA,
          p_device_type: /iPad|Tablet/i.test(UA) ? 'Tablet' : /Mobi|Android|iPhone|iPod/i.test(UA) ? 'Mobile' : 'Desktop',
          p_browser: /Edg\//.test(UA) ? 'Edge' : /OPR\/|Opera/.test(UA) ? 'Opera' : /SamsungBrowser/.test(UA) ? 'Samsung Internet' : /Firefox|FxiOS/.test(UA) ? 'Firefox' : /Chrome|CriOS/.test(UA) ? 'Chrome' : /Safari/.test(UA) ? 'Safari' : 'Other',
          p_os: /iPhone|iPad|iPod/.test(UA) ? 'iOS' : /Android/.test(UA) ? 'Android' : /Windows/.test(UA) ? 'Windows' : /Mac OS X|Macintosh/.test(UA) ? 'macOS' : /CrOS/.test(UA) ? 'ChromeOS' : /Linux/.test(UA) ? 'Linux' : 'Other',
          p_referer: document.referrer || 'Direct'
        };
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
        const safe = u => {
          const v = String(u || '').trim();
          if (!v) return '#';
          if (/^(https?:\/\/|mailto:|tel:|sms:|smsto:|geo:|upi:|bitcoin:|ethereum:|solana:)/i.test(v)) return v;
          if (/^[\w-]+(\.[\w-]+)+/.test(v)) return 'https://' + v;
          return '#';
        };
        const saveBlob = (name, text, mime) => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([text], { type: mime }));
          a.download = name;
          a.click();
        };

        let scanned = false;
        const recordScan = async () => {
          if (scanned) return;
          scanned = true;
          if (fromCloud && sbClient) {
            try { await Promise.race([sbClient.rpc('record_qr_scan', Object.assign({ p_code: code }, meta)), new Promise(r => setTimeout(r, 800))]); } catch (e) {}
          } else if (typeof DYNAMIC_QR !== 'undefined') {
            DYNAMIC_QR.trackScan(code, { device: meta.p_device_type, os: meta.p_os, browser: meta.p_browser, referrer: meta.p_referer });
          }
        };

        const videoEmbedUrl = (url) => {
          const u = String(url || '');
          const yt = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
          if (yt) return 'https://www.youtube.com/embed/' + yt[1];
          const vm = u.match(/vimeo\.com\/(\d+)/);
          if (vm) return 'https://player.vimeo.com/video/' + vm[1];
          return '';
        };

        const renderLanding = (p) => {
          hideLoader();
          document.title = (p.title || 'CraftQR') + ' | CraftQR';
          const link = (label, href, cls) => `<a class="btn ${cls || 'btn-secondary'}" href="${esc(safe(href))}" rel="noopener noreferrer">${esc(label)}</a>`;
          const ic = s => String(s == null ? '' : s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
          const ts = s => (s || '').replace(/[-:]/g, '').replace(/^(\d{8}T\d{4})$/, '$100');
          let body = '', after = null, desc = p.desc || '', badge = 'CraftQR Page';

          if (p.t === 'links') {
            badge = 'Link-in-Bio';
            body = (p.links || []).map((l, i) => link(l.label || l.url, l.url, i === 0 ? 'btn-primary' : 'btn-secondary')).join('');
          } else if (p.t === 'app') {
            badge = 'App Router';
            const goApp = /iPhone|iPad|iPod/.test(UA) ? p.ios : /Android/.test(UA) ? p.android : '';
            if (goApp) { window.location.replace(safe(goApp)); return; }
            desc = desc || 'Choose your platform';
            body = (p.ios ? link('Download for iOS', p.ios, 'btn-primary') : '') + (p.android ? link('Download for Android', p.android, 'btn-secondary') : '');
          } else if (p.t === 'vcard') {
            badge = 'Contact+ Card';
            const vcf = `BEGIN:VCARD\nVERSION:3.0\nFN:${ic(p.name || p.title)}\n${p.org ? `ORG:${ic(p.org)}\n` : ''}${p.role ? `TITLE:${ic(p.role)}\n` : ''}${p.phone ? `TEL:${p.phone}\n` : ''}${p.email ? `EMAIL:${p.email}\n` : ''}${p.url ? `URL:${p.url}\n` : ''}${p.adr ? `ADR:;;${ic(p.adr)};;;\n` : ''}END:VCARD`;
            const metaRows = [
              p.org ? ['Company', p.org] : null,
              p.role ? ['Role', p.role] : null,
              p.phone ? ['Phone', p.phone] : null,
              p.email ? ['Email', p.email] : null,
              p.adr ? ['Address', p.adr] : null
            ].filter(Boolean);
            body = (metaRows.length ? `<div class="kv-box">${metaRows.map(([k, v]) => `<div class="kv-row"><span class="kv-k">${esc(k)}</span><span class="kv-v">${esc(v)}</span></div>`).join('')}</div>` : '') +
              `<button class="btn btn-primary" id="vcb" type="button">Save Contact (.vcf)</button>` +
              (p.phone ? link('Call ' + p.phone, 'tel:' + p.phone) : '') +
              (p.email ? link('Email ' + p.email, 'mailto:' + p.email) : '') +
              (p.url ? link('Visit Website', p.url) : '');
            after = () => {
              const b = document.getElementById('vcb');
              if (b) b.onclick = () => saveBlob(((p.name || p.title) || 'contact') + '.vcf', vcf, 'text/vcard');
            };
          } else if (p.t === 'menu') {
            badge = 'Digital Menu';
            const groups = {};
            (p.items || []).forEach(row => {
              const cat = (row[0] || 'Menu').trim();
              if (!groups[cat]) groups[cat] = [];
              groups[cat].push(row);
            });
            const secHtml = Object.keys(groups).map(cat => `
              <div class="menu-cat-box">
                <div class="menu-cat">${esc(cat)}</div>
                ${groups[cat].map(r => `
                  <div class="menu-row">
                    <div>
                      <div class="menu-dish">${esc(r[1] || r[0])}</div>
                      ${r[3] ? `<div class="menu-note">${esc(r[3])}</div>` : ''}
                    </div>
                    ${r[2] ? `<div class="menu-price">${esc(r[2])}</div>` : ''}
                  </div>`).join('')}
              </div>`).join('');
            body = `<div class="menu-sec">${secHtml || '<div class="msg">No menu items listed yet.</div>'}</div>` +
              (p.url ? link('Full Ordering / Website', p.url, 'btn-primary') : '');
          } else if (p.t === 'feedback') {
            badge = 'Review Gate';
            desc = desc || 'Tap a star rating to share your experience';
            body = `
              <div class="star-row" role="group" aria-label="Rate your experience">
                ${[1, 2, 3, 4, 5].map(n => `<button type="button" class="star-btn" data-star="${n}" aria-label="${n} star"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></button>`).join('')}
              </div>
              <div id="fbAction" class="stack"></div>
            `;
            after = () => {
              const btns = app.querySelectorAll('.star-btn');
              const out = document.getElementById('fbAction');
              btns.forEach(btn => {
                btn.onclick = () => {
                  const n = parseInt(btn.dataset.star, 10);
                  btns.forEach(b => b.classList.toggle('lit', parseInt(b.dataset.star, 10) <= n));
                  if (n >= 4) {
                    out.innerHTML = `<div class="msg" style="margin:6px 0 8px;">Thank you! Mind sharing your ${n}-star review publicly?</div>` +
                      (p.url ? link('Leave a Public Review', p.url, 'btn-primary') : '<div class="msg">No public review link configured.</div>');
                  } else {
                    out.innerHTML = `<div class="msg" style="margin:6px 0 8px;">We want to make this right. Please message us directly:</div>` +
                      (p.fbUrl ? link('Send Private Feedback', p.fbUrl, 'btn-primary') : '<div class="msg">Thank you for letting us know.</div>');
                  }
                };
              });
            };
          } else if (p.t === 'payment') {
            badge = 'Checkout';
            body = `
              <div class="pay-box">
                <div class="pay-cur">${esc(p.currency || 'Amount Due')}</div>
                <div class="pay-amt">${esc(p.amount ? ((p.currency ? p.currency + ' ' : '') + p.amount) : 'Open Payment')}</div>
              </div>
              ${p.url ? link('Proceed to Pay', p.url, 'btn-primary') : ''}
              ${p.url ? '<button class="btn btn-secondary" id="cpPayBtn" type="button">Copy Payment Link</button>' : ''}
            `;
            after = () => {
              const b = document.getElementById('cpPayBtn');
              if (b && p.url) b.onclick = () => navigator.clipboard?.writeText(p.url).then(() => { b.textContent = 'Copied!'; });
            };
          } else if (p.t === 'event') {
            badge = 'Event & RSVP';
            const evStart = ts(p.start);
            const evEnd = ts(p.end || p.start);
            const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${ic(p.title)}\nDTSTART:${evStart}\nDTEND:${evEnd}\nLOCATION:${ic(p.loc)}\nDESCRIPTION:${ic(p.desc)}\nEND:VEVENT\nEND:VCALENDAR`;
            const calMeta = [
              p.start ? ['Starts', new Date(p.start).toLocaleString()] : null,
              p.end ? ['Ends', new Date(p.end).toLocaleString()] : null,
              p.loc ? ['Location', p.loc] : null
            ].filter(Boolean);
            body = (calMeta.length ? `<div class="kv-box">${calMeta.map(([k, v]) => `<div class="kv-row"><span class="kv-k">${esc(k)}</span><span class="kv-v">${esc(v)}</span></div>`).join('')}</div>` : '') +
              (p.url ? link('Tickets / RSVP Link', p.url, 'btn-primary') : '') +
              `<button class="btn ${p.url ? 'btn-secondary' : 'btn-primary'}" id="evb" type="button">Add to Calendar (.ics)</button>`;
            after = () => {
              const b = document.getElementById('evb');
              if (b) b.onclick = () => saveBlob((p.title || 'event') + '.ics', ics, 'text/calendar');
            };
          } else if (p.t === 'coupon') {
            badge = 'Offer & Coupon';
            desc = p.desc || (p.off ? p.off + ' ' : '') + (p.expiry ? 'Valid until ' + p.expiry : 'Redeem in store or online');
            body = (p.code ? `<div class="code" id="cpCode">${esc(p.code)}</div><button class="btn btn-primary" id="cpBtn" type="button">Copy Coupon Code</button>` : '') +
              (p.url ? link('Redeem Offer', p.url, p.code ? 'btn-secondary' : 'btn-primary') : '');
            after = () => {
              const b = document.getElementById('cpBtn');
              if (b) b.onclick = () => navigator.clipboard?.writeText(p.code || '').then(() => { b.textContent = 'Copied!'; });
            };
          } else if (p.t === 'pdf') {
            badge = 'PDF Showcase';
            body = (p.url ? link('Open / Download PDF', p.url, 'btn-primary') : '<div class="msg">No document URL attached.</div>');
          } else if (p.t === 'images') {
            badge = 'Photo Gallery';
            const imgs = (p.imgs || []).filter(Boolean);
            body = `<div class="gallery-grid">${imgs.map(u => `<a class="gallery-item" href="${esc(safe(u))}" target="_blank" rel="noopener noreferrer"><img src="${esc(safe(u))}" alt="Gallery photo" loading="lazy" decoding="async"></a>`).join('')}</div>` +
              (imgs[0] ? link('Open First Full Image', imgs[0], 'btn-secondary') : '');
          } else if (p.t === 'video') {
            badge = 'Video Showcase';
            const embed = videoEmbedUrl(p.url);
            body = (embed ? `<div class="vid-frame"><iframe src="${esc(embed)}" allowfullscreen title="${esc(p.title || 'Video')}"></iframe></div>` : '') +
              (p.url ? link('Watch Full Video', p.url, 'btn-primary') : '');
          } else if (p.t === 'business') {
            badge = 'Business Profile';
            const bzRows = [
              p.hours ? ['Hours', p.hours] : null,
              p.phone ? ['Phone', p.phone] : null
            ].filter(Boolean);
            body = (bzRows.length ? `<div class="kv-box">${bzRows.map(([k, v]) => `<div class="kv-row"><span class="kv-k">${esc(k)}</span><span class="kv-v">${esc(v)}</span></div>`).join('')}</div>` : '') +
              (p.url ? link('Visit Website', p.url, 'btn-primary') : '') +
              (p.phone ? link('Call ' + p.phone, 'tel:' + p.phone, 'btn-secondary') : '');
          } else if (p.t === 'survey') {
            badge = 'Quick Survey';
            body = p.url ? link('Start Survey', p.url, 'btn-primary') : '';
          }

          app.innerHTML = `<div class="brand-eyebrow">${esc(badge)}</div><div class="title">${esc(p.title)}</div><div class="msg">${esc(desc)}</div><div class="stack">${body}</div>`;
          if (after) after();
        };

        const parseTimeMinutes = (hhmm) => {
          const m = String(hhmm || '').trim().match(/^(\d{1,2}):(\d{2})$/);
          return m ? (parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : -1;
        };

        const go = async (dest) => {
          let target = dest || entry.destination || entry.content;
          if (!target) { renderError(ICONS.warning, 'Empty Destination', 'This QR code has no target link configured.'); return; }
          const page = typeof DYNAMIC_QR !== 'undefined' ? DYNAMIC_QR.decodePayload(target) : null;
          if (page) {
            const now = Date.now();
            const fb = page.fb ? (/^https?:\/\//i.test(page.fb) ? page.fb : 'https://' + page.fb) : null;
            const deny = (icon, title, msg) => { if (fb) { window.location.replace(fb); } else { renderError(icon, title, msg); } };
            const used = entry.scansCount != null ? entry.scansCount : (entry.scans || 0);
            if (page.paused) { deny(ICONS.warning, 'Campaign Paused', 'This dynamic QR campaign is temporarily paused.'); return; }
            if (page.exp && new Date(page.exp) < now) { deny(ICONS.expired, 'QR Code Expired', 'This dynamic campaign link has reached its expiration date.'); return; }
            if (page.start && new Date(page.start) > now) { deny(ICONS.expired, 'Upcoming Campaign', `This QR code will activate on ${new Date(page.start).toLocaleDateString()}.`); return; }
            if (page.end && new Date(page.end) < now) { deny(ICONS.expired, 'Campaign Ended', `This campaign concluded on ${new Date(page.end).toLocaleDateString()}.`); return; }
            if (page.max && used >= page.max) { deny(ICONS.warning, 'Scan Limit Reached', 'This QR code has reached its maximum number of scans.'); return; }
            await recordScan();
            if (page.t !== 'go') { renderLanding(page); return; }

            // Smart routing: device, language, daypart window, A/B rotation, UTM parameters
            target = (/iPhone|iPad|iPod/.test(UA) ? page.ios : /Android/.test(UA) ? page.android : page.desktop) || page.url;
            if (Array.isArray(page.lang) && page.lang.length) {
              const navLang = (navigator.language || '').toLowerCase();
              const hit = page.lang.find(([pfx, u]) => pfx && u && navLang.startsWith(pfx.toLowerCase()));
              if (hit) target = hit[1];
            }
            if (Array.isArray(page.daypart) && page.daypart.length) {
              const d = new Date();
              const curMin = d.getHours() * 60 + d.getMinutes();
              const hit = page.daypart.find(([win, u]) => {
                if (!win || !u) return false;
                const parts = String(win).split('-');
                if (parts.length !== 2) return false;
                const sMin = parseTimeMinutes(parts[0]), eMin = parseTimeMinutes(parts[1]);
                if (sMin < 0 || eMin < 0) return false;
                return sMin <= eMin ? (curMin >= sMin && curMin <= eMin) : (curMin >= sMin || curMin <= eMin);
              });
              if (hit) target = hit[1];
            }
            if (page.ab && page.ab.length) {
              const pool = [target].concat(page.ab);
              target = pool[Math.floor(Math.random() * pool.length)];
            }
            if (page.utm && !/^(mailto:|tel:|sms:|smsto:|geo:|upi:|bitcoin:|ethereum:|solana:)/i.test(target)) {
              try {
                const u = new URL(/^https?:/i.test(target) ? target : 'https://' + target.replace(/^\/+/, ''));
                [['s', 'source'], ['m', 'medium'], ['c', 'campaign']].forEach(([k, n]) => {
                  if (page.utm[k] && !u.searchParams.has('utm_' + n)) u.searchParams.set('utm_' + n, page.utm[k]);
                });
                target = u.href;
              } catch (e) {}
            }
          } else {
            await recordScan();
          }

          if (/^WIFI:/i.test(target)) {
            hideLoader();
            const ssid = (target.match(/S:((?:\\.|[^;])*)/i) || [])[1]?.replace(/\\(.)/g, '$1') || '';
            const pass = (target.match(/P:((?:\\.|[^;])*)/i) || [])[1]?.replace(/\\(.)/g, '$1') || '';
            const sec = (target.match(/T:([^;]*)/i) || [])[1] || 'WPA';
            app.innerHTML = `
              <div class="brand-eyebrow">Wi-Fi Credentials</div>
              <div class="title">${esc(ssid || 'Guest Network')}</div>
              <div class="msg">Join this wireless network using the details below.</div>
              <div class="kv-box">
                <div class="kv-row"><span class="kv-k">Network</span><span class="kv-v">${esc(ssid)}</span></div>
                <div class="kv-row"><span class="kv-k">Security</span><span class="kv-v">${esc(sec)}</span></div>
              </div>
              ${pass ? `<div class="code">${esc(pass)}</div><div class="stack"><button type="button" class="btn btn-primary" id="wfCpBtn">Copy Wi-Fi Password</button></div>` : '<div class="msg">Open network (no password required).</div>'}
            `;
            const wfBtn = document.getElementById('wfCpBtn');
            if (wfBtn) wfBtn.onclick = () => navigator.clipboard?.writeText(pass).then(() => { wfBtn.textContent = 'Copied!'; });
            return;
          }
          if (/^BEGIN:/i.test(target)) {
            hideLoader();
            app.innerHTML = `<div class="brand-eyebrow">Structured Payload</div><div class="title">Saved Content</div><div class="msg">Ready to save or copy.</div><div class="code" style="font-size:.82rem;text-align:left;letter-spacing:0;white-space:pre-wrap">${esc(target)}</div>`;
            return;
          }
          if (!/^(https?:|mailto:|tel:|sms:|smsto:|geo:|upi:|bitcoin:|ethereum:|solana:)/i.test(target)) {
            target = 'https://' + target.replace(/^\/+/, '');
          }
          window.location.replace(target);
        };

        const blob = typeof entry.destination === 'string' && entry.destination.indexOf('enc:v1:') === 0 ? entry.destination : null;
        const localHash = entry.isPasswordProtected !== false && (entry.authHash || entry.passwordHash);
        if (!blob && !localHash && entry.isPasswordProtected && fromCloud) {
          renderError(ICONS.locked, 'Protected QR Code', 'This code was locked before cross-device passcodes existed. Ask the owner to re-save it.');
          return;
        }
        if (blob || localHash) {
          hideLoader();
          app.innerHTML = `
            <div class="brand-eyebrow">CraftQR Lock</div>
            <div class="icon-container">${ICONS.locked}</div>
            <div class="title">Protected QR Code</div>
            <div class="msg">Enter the passcode to continue.</div>
            <form id="pwdForm">
              <input type="password" class="pwd-input" id="pwdInput" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode" required />
              <div class="err-text" id="errText" role="alert">Incorrect passcode. Please try again.</div>
              <button type="submit" class="btn btn-primary">Unlock &amp; Continue</button>
            </form>`;
          const pwdInput = document.getElementById('pwdInput'), errText = document.getElementById('errText');
          document.getElementById('pwdForm').onsubmit = async function (e) {
            e.preventDefault();
            const val = pwdInput.value, btn = this.querySelector('button');
            btn.disabled = true;
            let plain = null, ok = false;
            if (blob) { plain = await DYNAMIC_QR.unlock(blob, val); ok = plain !== null; }
            else { ok = await DYNAMIC_QR.checkPassword(code, val); }
            btn.disabled = false;
            if (ok) {
              app.innerHTML = '<div class="brand-eyebrow">CraftQR</div><div class="spinner"></div><div class="title">Access Verified</div><div class="msg" role="status">Redirecting&hellip;</div>';
              go(blob ? plain : undefined);
            } else {
              errText.style.display = 'block';
              pwdInput.value = '';
              pwdInput.focus();
            }
          };
          pwdInput.focus();
          return;
        }

        await go();
      } catch (err) {
        console.error('Redirection error:', err);
        renderError(ICONS.warning, 'Redirect Error', 'Unable to complete redirection. Please try again.');
      }
    });
  </script>
  <script defer src="col-ui.js"></script>
</body>
</html>
