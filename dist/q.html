<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7939810376745995"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dynamic QR Code Redirection Service by Class Of Learners." />
  <meta name="google-site-verification" content="bWaer2b60VA1y3RMV48HYGPv8vlMUcvlFGxY3e6SAqU" />
  <title>Redirecting... | Class Of Learners</title>
  <script src="qr-dynamic.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #070a14;
      color: #e8e3d8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: rgba(18, 24, 38, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 36px 28px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 8px;
    }
    .msg {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .icon-badge {
      font-size: 2.8rem;
      margin-bottom: 16px;
      display: inline-block;
    }
    .pwd-input {
      width: 100%;
      background: #0d121f;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
      letter-spacing: 2px;
    }
    .pwd-input:focus {
      border-color: #3b82f6;
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 10px;
      text-decoration: none;
      display: inline-block;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .err-text {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="spinner"></div>
    <div class="title">Redirecting...</div>
    <div class="msg">Connecting to your destination</div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      let code = params.get('id') || params.get('code');
      if (!code) {
        const pathParts = window.location.pathname.split('/');
        const lastPart = pathParts.pop() || pathParts.pop();
        if (lastPart && lastPart !== 'q.html' && lastPart !== 'q' && lastPart !== 'qr') {
          code = lastPart;
        }
      }

      const app = document.getElementById('app');

      function renderError(icon, title, message) {
        app.innerHTML = `
          <div class="icon-badge">${icon}</div>
          <div class="title">${title}</div>
          <div class="msg">${message}</div>
          <a href="/home" class="btn btn-secondary">Return to Home</a>
        `;
      }

      if (!code) {
        renderError('🔍', 'Missing QR Code', 'No destination or QR code identifier was provided.');
        return;
      }

      try {
        let entry = null;

        // 1. Lookup in DYNAMIC_QR
        if (typeof DYNAMIC_QR !== 'undefined') {
          entry = DYNAMIC_QR.getByCode(code);
        }

        // 2. Lookup in qrs_min
        if (!entry) {
          try {
            const raw = localStorage.getItem('qrs_min');
            if (raw) {
              const list = JSON.parse(raw);
              entry = list.find(q => q.shortCode === code || String(q.id) === String(code));
            }
          } catch(e) {}
        }

        // 3. Fallback via parent if inside iframe
        if (!entry && window.parent !== window) {
          try {
            if (window.parent.DYNAMIC_QR) {
              entry = window.parent.DYNAMIC_QR.getByCode(code);
            }
          } catch(e) {}
        }

        if (!entry) {
          renderError('❌', 'QR Code Not Found', 'This dynamic QR code may have been deleted or expired.');
          return;
        }

        // Expiration check
        if (entry.expiry && new Date(entry.expiry) < new Date()) {
          renderError('⌛', 'QR Code Expired', `This link expired on ${new Date(entry.expiry).toLocaleDateString()}.`);
          return;
        }

        // Schedule check
        if (entry.schedule) {
          const now = new Date();
          if (entry.schedule.start && new Date(entry.schedule.start) > now) {
            renderError('📅', 'Upcoming Campaign', `This QR code will be active starting on ${new Date(entry.schedule.start).toLocaleDateString()}.`);
            return;
          }
          if (entry.schedule.end && new Date(entry.schedule.end) < now) {
            renderError('⌛', 'Campaign Ended', `This campaign ended on ${new Date(entry.schedule.end).toLocaleDateString()}.`);
            return;
          }
        }

        // Handle Scan tracking
        const trackScan = () => {
          const scanData = {
            ip: 'client',
            country: 'Unknown',
            city: 'Unknown',
            device: /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
            os: navigator.userAgent.includes('Windows') ? 'Windows' :
                navigator.userAgent.includes('Mac') ? 'macOS' :
                navigator.userAgent.includes('Android') ? 'Android' :
                navigator.userAgent.includes('iPhone') || navigator.userAgent.includes('iPad') ? 'iOS' : 'Linux',
            browser: navigator.userAgent.includes('Chrome') ? 'Chrome' :
                     navigator.userAgent.includes('Firefox') ? 'Firefox' :
                     navigator.userAgent.includes('Safari') ? 'Safari' : 'Other',
            referrer: document.referrer || 'Direct'
          };

          if (typeof DYNAMIC_QR !== 'undefined') {
            DYNAMIC_QR.trackScan(code, scanData);
          }
        };

        const doRedirect = (dest) => {
          trackScan();
          let target = dest || entry.destination || entry.content;
          if (!target) {
            renderError('⚠️', 'Empty Destination', 'This QR code has no destination configured.');
            return;
          }
          if (!/^https?:\/\//i.test(target) && !/^mailto:/i.test(target) && !/^tel:/i.test(target) && !/^sms:/i.test(target) && !/^wa\.me/i.test(target)) {
            target = 'https://' + target;
          }
          window.location.href = target;
        };

        // Password protected check
        if (entry.password) {
          const savedAuth = sessionStorage.getItem('qr_auth_' + code);
          if (savedAuth && (savedAuth === entry.password || DYNAMIC_QR.hashPassword(savedAuth) === entry.password)) {
            doRedirect();
            return;
          }

          app.innerHTML = `
            <div class="icon-badge">🔒</div>
            <div class="title">Protected QR Code</div>
            <div class="msg">Please enter the security password to proceed to this destination.</div>
            <form id="pwdForm" onsubmit="return false;">
              <input type="password" class="pwd-input" id="pwdInput" placeholder="••••••••" autofocus required />
              <div class="err-text" id="errText">Incorrect password. Please try again.</div>
              <button type="submit" class="btn btn-primary" id="pwdSubmit">Unlock &amp; Continue</button>
            </form>
          `;

          const pwdForm = document.getElementById('pwdForm');
          const pwdInput = document.getElementById('pwdInput');
          const errText = document.getElementById('errText');

          pwdForm.onsubmit = function(e) {
            e.preventDefault();
            const val = pwdInput.value;
            if (val === entry.password || DYNAMIC_QR.hashPassword(val) === entry.password) {
              sessionStorage.setItem('qr_auth_' + code, val);
              app.innerHTML = `
                <div class="spinner"></div>
                <div class="title">Unlocked!</div>
                <div class="msg">Redirecting you now...</div>
              `;
              setTimeout(() => doRedirect(), 400);
            } else {
              errText.style.display = 'block';
              pwdInput.value = '';
              pwdInput.focus();
            }
          };
          return;
        }

        // Immediate redirect
        doRedirect();

      } catch (err) {
        console.error('Redirection error:', err);
        renderError('⚠️', 'Redirect Error', 'Unable to complete redirection. Please try again later.');
      }
    })();
  </script>
</body>
</html>
