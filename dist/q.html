<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dynamic QR Code Redirection Service by Class Of Learners." />
  <meta name="google-site-verification" content="bWaer2b60VA1y3RMV48HYGPv8vlMUcvlFGxY3e6SAqU" />
  <title>Redirecting... | Class Of Learners</title>
  <link rel="icon" type="image/png" href="Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="qr-dynamic.js"></script>
  <script>
    ;(function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('lm')
          document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('lm')
          })
        }
      } catch (e) {}
    })()
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070a14;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    body.lm {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --accent: #059669;
      --text: #0f172a;
      --text-muted: #475569;
      --danger: #dc2626;
    }
    body.lm .card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    body.lm .spinner {
      border: 3px solid rgba(0, 0, 0, 0.08);
      border-top-color: var(--accent);
    }
    body.lm .icon-container {
      background: rgba(5, 150, 105, 0.08);
      border-color: rgba(5, 150, 105, 0.2);
    }
    body.lm .pwd-input {
      background: #f8fafc;
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: #0f172a;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(94, 212, 245, 0.08), transparent 40%);
      z-index: 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .msg {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .icon-container {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent);
    }
    .icon-container.err {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .pwd-input {
      width: 100%;
      background: rgba(7, 10, 20, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
      letter-spacing: 2px;
    }
    .pwd-input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #070a14;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .err-text {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="spinner"></div>
    <div class="title">Redirecting...</div>
    <div class="msg">Connecting to your destination</div>
  </div>

  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      let code = params.get('id') || params.get('code');
      if (!code) {
        const pathParts = window.location.pathname.split('/');
        const lastPart = pathParts.pop() || pathParts.pop();
        if (lastPart && lastPart !== 'q.html' && lastPart !== 'q' && lastPart !== 'qr') {
          code = lastPart;
        }
      }

      const app = document.getElementById('app');

      function renderError(svgIcon, title, message) {
        app.innerHTML = `
          <div class="icon-container err">${svgIcon}</div>
          <div class="title">${title}</div>
          <div class="msg">${message}</div>
          <a href="/home" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Return to Home
          </a>
        `;
      }

      const ICONS = {
        missing: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
        notFound: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        expired: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        locked: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
        warning: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
      };

      if (!code) {
        renderError(ICONS.missing, 'Missing QR Code', 'No destination or QR code identifier was provided.');
        return;
      }

      if (typeof DYNAMIC_QR !== 'undefined' && DYNAMIC_QR.ready) {
        await DYNAMIC_QR.ready;
      }

      // Initialize Supabase client
      let sbClient = null;
      try {
        const cfgRes = await fetch('config.json');
        const cfg = await cfgRes.json();
        if (cfg.auth && cfg.auth.url && typeof window.supabase !== 'undefined') {
          sbClient = window.supabase.createClient(cfg.auth.url, cfg.auth.key);
        }
      } catch(e) {}

      try {
        let entry = null;

        // 1. First priority: Remote Supabase dynamic QR lookup (RPC lookup_dynamic_qr)
        if (sbClient) {
          try {
            const { data, error } = await sbClient.rpc('lookup_dynamic_qr', { p_code: code });
            if (data && data.found) {
              entry = {
                id: data.id,
                shortCode: data.short_code,
                title: data.title,
                type: data.type,
                destination: data.destination_url,
                isDynamic: data.is_dynamic,
                isPasswordProtected: data.is_password_protected,
                isExpired: data.is_expired,
                scansCount: data.scans_count
              };

              // Asynchronously record detailed analytics
              sbClient.rpc('record_qr_scan', {
                p_code: code,
                p_user_agent: navigator.userAgent,
                p_device_type: /Mobile|Android|iPhone|iPad/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop',
                p_browser: navigator.userAgent.includes('Chrome') ? 'Chrome' : navigator.userAgent.includes('Firefox') ? 'Firefox' : navigator.userAgent.includes('Safari') ? 'Safari' : 'Other',
                p_os: navigator.userAgent.includes('Windows') ? 'Windows' : navigator.userAgent.includes('Mac') ? 'macOS' : navigator.userAgent.includes('Android') ? 'Android' : navigator.userAgent.includes('iOS') ? 'iOS' : 'Linux',
                p_referer: document.referrer || 'Direct'
              }).then(() => {}).catch(() => {});
            }
          } catch(rpcErr) {
            console.warn('Supabase lookup_dynamic_qr error:', rpcErr);
          }
        }

        // 2. Second priority: Local storage lookup via DYNAMIC_QR
        if (!entry && typeof DYNAMIC_QR !== 'undefined') {
          entry = DYNAMIC_QR.getByCode(code);
        }

        // 3. Fallback: qrs_min in localStorage
        if (!entry) {
          try {
            const raw = localStorage.getItem('qrs_min');
            if (raw) {
              const list = JSON.parse(raw);
              entry = list.find(q => q.shortCode === code || String(q.id) === String(code));
            }
          } catch(e) {}
        }

        if (!entry) {
          renderError(ICONS.notFound, 'QR Code Not Found', 'This dynamic QR code may have been deleted or does not exist.');
          return;
        }

        // Expiration check
        if (entry.isExpired || (entry.expiry && new Date(entry.expiry) < new Date())) {
          renderError(ICONS.expired, 'QR Code Expired', 'This dynamic campaign link has reached its expiration date.');
          return;
        }

        // Schedule check
        if (entry.schedule) {
          const now = new Date();
          if (entry.schedule.start && new Date(entry.schedule.start) > now) {
            renderError(ICONS.expired, 'Upcoming Campaign', `This QR code will activate on ${new Date(entry.schedule.start).toLocaleDateString()}.`);
            return;
          }
          if (entry.schedule.end && new Date(entry.schedule.end) < now) {
            renderError(ICONS.expired, 'Campaign Ended', `This campaign concluded on ${new Date(entry.schedule.end).toLocaleDateString()}.`);
            return;
          }
        }

        const doRedirect = (dest) => {
          let target = dest || entry.destination || entry.content;
          if (!target) {
            renderError(ICONS.warning, 'Empty Destination', 'This QR code has no target link configured.');
            return;
          }
          if (!/^https?:\/\//i.test(target) && !/^mailto:/i.test(target) && !/^tel:/i.test(target) && !/^sms:/i.test(target) && !/^wa\.me/i.test(target)) {
            target = 'https://' + target;
          }
          window.location.href = target;
        };

        // Password protection check. The entered password is never stored;
        // only a short-lived success marker is kept for this tab.
        if (entry.isPasswordProtected || entry.passwordHash) {
          const savedAuth = sessionStorage.getItem('qr_auth_' + code) === 'verified';
          if (savedAuth) {
            doRedirect();
            return;
          }

          app.innerHTML = `
            <div class="icon-container">${ICONS.locked}</div>
            <div class="title">Protected QR Code</div>
            <div class="msg">Please enter the passcode to access this destination.</div>
            <form id="pwdForm" onsubmit="return false;">
              <input type="password" class="pwd-input" id="pwdInput" placeholder="Enter Passcode" autofocus required />
              <div class="err-text" id="errText">Incorrect passcode. Please try again.</div>
              <button type="submit" class="btn btn-primary" id="pwdSubmit">
                Unlock &amp; Continue
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </button>
            </form>
          `;

          const pwdForm = document.getElementById('pwdForm');
          const pwdInput = document.getElementById('pwdInput');
          const errText = document.getElementById('errText');

          pwdForm.onsubmit = async function(e) {
            e.preventDefault();
            const val = pwdInput.value.trim();
            const valid = typeof DYNAMIC_QR !== 'undefined' && await DYNAMIC_QR.checkPassword(code, val);
            if (valid) {
              sessionStorage.setItem('qr_auth_' + code, 'verified');
              app.innerHTML = `
                <div class="spinner"></div>
                <div class="title">Access Verified</div>
                <div class="msg">Redirecting to destination...</div>
              `;
              setTimeout(() => doRedirect(), 300);
            } else {
              errText.style.display = 'block';
              pwdInput.value = '';
              pwdInput.focus();
            }
          };
          return;
        }

        // Direct instant redirect
        doRedirect();

      } catch (err) {
        console.error('Redirection error:', err);
        renderError(ICONS.warning, 'Redirect Error', 'Unable to complete redirection. Please try again.');
      }
    })();
  </script>
</body>
</html>
