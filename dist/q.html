<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dynamic QR Code Redirection Service by Class Of Learners." />
  <meta name="google-site-verification" content="bWaer2b60VA1y3RMV48HYGPv8vlMUcvlFGxY3e6SAqU" />
  <title>Redirecting... | Class Of Learners</title>
  <link rel="icon" type="image/png" href="Icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="qr-dynamic.js"></script>
  <script>
    ;(function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.classList.add('lm')
          document.addEventListener('DOMContentLoaded', function() {
            document.body.classList.add('lm')
          })
        }
      } catch (e) {}
    })()
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070a14;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #10b981;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    body.lm {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --accent: #059669;
      --text: #0f172a;
      --text-muted: #475569;
      --danger: #dc2626;
    }
    body.lm .card {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }
    body.lm .spinner {
      border: 3px solid rgba(0, 0, 0, 0.08);
      border-top-color: var(--accent);
    }
    body.lm .icon-container {
      background: rgba(5, 150, 105, 0.08);
      border-color: rgba(5, 150, 105, 0.2);
    }
    body.lm .pwd-input {
      background: #f8fafc;
      border: 1px solid rgba(0, 0, 0, 0.15);
      color: #0f172a;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 20% 30%, rgba(16, 185, 129, 0.08), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(94, 212, 245, 0.08), transparent 40%);
      z-index: 0;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(20px);
      position: relative;
      z-index: 1;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .msg {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .icon-container {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      color: var(--accent);
    }
    .icon-container.err {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .pwd-input {
      width: 100%;
      background: rgba(7, 10, 20, 0.8);
      border: 1px solid var(--border);
      color: #fff;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
      text-align: center;
      letter-spacing: 2px;
    }
    .pwd-input:focus {
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--accent);
      color: #070a14;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--border);
      margin-top: 12px;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .err-text {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: -10px;
      margin-bottom: 14px;
      display: none;
    }
    body.lm .btn-secondary { background: #f1f5f9; color: #334155; }
    .card { margin: auto; }
    .stack { display: grid; gap: 10px; margin-top: 8px; }
    .stack .btn { margin: 0; min-height: 48px; }
    .code { font-family: 'Space Mono', monospace; font-size: 1.4rem; letter-spacing: 3px; padding: 14px; border: 2px dashed var(--accent); border-radius: 12px; margin-bottom: 14px; user-select: all; word-break: break-all; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>

  <div class="card" id="app">
    <div class="spinner"></div>
    <div class="title">Redirecting...</div>
    <div class="msg">Connecting to your destination</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      const params = new URLSearchParams(window.location.search);
      let code = params.get('id') || params.get('code');
      if (!code) {
        const pathParts = window.location.pathname.split('/');
        const lastPart = pathParts.pop() || pathParts.pop();
        if (lastPart && lastPart !== 'q.html' && lastPart !== 'q' && lastPart !== 'qr') {
          code = lastPart;
        }
      }

      const app = document.getElementById('app');

      function renderError(svgIcon, title, message) {
        app.innerHTML = `
          <div class="icon-container err">${svgIcon}</div>
          <div class="title">${title}</div>
          <div class="msg">${message}</div>
          <a href="/home" class="btn btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Return to Home
          </a>
        `;
      }

      const ICONS = {
        missing: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
        notFound: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>',
        expired: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
        locked: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
        warning: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
      };

      if (!code) {
        renderError(ICONS.missing, 'Missing QR Code', 'No destination or QR code identifier was provided.');
        return;
      }

      if (typeof DYNAMIC_QR !== 'undefined' && DYNAMIC_QR.ready) {
        await DYNAMIC_QR.ready;
      }

      // Initialize Supabase client
      let sbClient = null;
      try {
        let cfg = {};
        for (const u of ['config.json', '/config.json']) {
          try { const r = await fetch(u); if (r.ok) { cfg = await r.json(); break; } } catch (e) {}
        }
        if (cfg.auth && cfg.auth.url && typeof window.supabase !== 'undefined') {
          sbClient = window.supabase.createClient(cfg.auth.url, cfg.auth.key);
        }
      } catch(e) {}

      try {
        let entry = null, fromCloud = false;

        // 1. First priority: Remote Supabase dynamic QR lookup (RPC lookup_dynamic_qr)
        if (sbClient) {
          try {
            const { data, error } = await sbClient.rpc('lookup_dynamic_qr', { p_code: code });
            if (data && data.found) {
              entry = {
                id: data.id,
                shortCode: data.short_code,
                title: data.title,
                type: data.type,
                destination: data.destination_url,
                isDynamic: data.is_dynamic,
                isPasswordProtected: data.is_password_protected,
                isExpired: data.is_expired,
                scansCount: data.scans_count
              };

              fromCloud = true;
            }
          } catch(rpcErr) {
            console.warn('Supabase lookup_dynamic_qr error:', rpcErr);
          }
        }

        // 2. Second priority: Local storage lookup via DYNAMIC_QR
        if (!entry && typeof DYNAMIC_QR !== 'undefined') {
          entry = DYNAMIC_QR.getByCode(code);
        }

        // 3. Fallback: qrs_min in localStorage
        if (!entry) {
          try {
            const raw = localStorage.getItem('qrs_min');
            if (raw) {
              const list = JSON.parse(raw);
              entry = list.find(q => q.shortCode === code || String(q.id) === String(code));
            }
          } catch(e) {}
        }

        if (!entry) {
          renderError(ICONS.notFound, 'QR Code Not Found', 'This dynamic QR code may have been deleted or does not exist.');
          return;
        }

        // Expiration check
        if (entry.isExpired || (entry.expiry && new Date(entry.expiry) < new Date())) {
          renderError(ICONS.expired, 'QR Code Expired', 'This dynamic campaign link has reached its expiration date.');
          return;
        }

        // Schedule check
        if (entry.schedule) {
          const now = new Date();
          if (entry.schedule.start && new Date(entry.schedule.start) > now) {
            renderError(ICONS.expired, 'Upcoming Campaign', `This QR code will activate on ${new Date(entry.schedule.start).toLocaleDateString()}.`);
            return;
          }
          if (entry.schedule.end && new Date(entry.schedule.end) < now) {
            renderError(ICONS.expired, 'Campaign Ended', `This campaign concluded on ${new Date(entry.schedule.end).toLocaleDateString()}.`);
            return;
          }
        }

        const UA = navigator.userAgent;
        const meta = {
          p_user_agent: UA,
          p_device_type: /iPad|Tablet/i.test(UA) ? 'Tablet' : /Mobi|Android|iPhone|iPod/i.test(UA) ? 'Mobile' : 'Desktop',
          p_browser: /Edg\//.test(UA) ? 'Edge' : /OPR\/|Opera/.test(UA) ? 'Opera' : /SamsungBrowser/.test(UA) ? 'Samsung Internet' : /Firefox|FxiOS/.test(UA) ? 'Firefox' : /Chrome|CriOS/.test(UA) ? 'Chrome' : /Safari/.test(UA) ? 'Safari' : 'Other',
          p_os: /iPhone|iPad|iPod/.test(UA) ? 'iOS' : /Android/.test(UA) ? 'Android' : /Windows/.test(UA) ? 'Windows' : /Mac OS X|Macintosh/.test(UA) ? 'macOS' : /CrOS/.test(UA) ? 'ChromeOS' : /Linux/.test(UA) ? 'Linux' : 'Other',
          p_referer: document.referrer || 'Direct'
        };
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
        const safe = u => /^(https?:\/\/|mailto:|tel:)/i.test(u || '') ? u : (/^[\w-]+(\.[\w-]+)+/.test(u || '') ? 'https://' + u : '#');
        const save = (name, text, mime) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = name; a.click(); };
        let scanned = false;
        // Count the scan only once access is granted, and wait (max 0.8s) so the redirect cannot cancel the request.
        const recordScan = async () => {
          if (scanned) {return;}
          scanned = true;
          if (fromCloud && sbClient) {
            try { await Promise.race([sbClient.rpc('record_qr_scan', Object.assign({ p_code: code }, meta)), new Promise(r => setTimeout(r, 800))]); } catch (e) {}
          } else if (typeof DYNAMIC_QR !== 'undefined') {
            DYNAMIC_QR.trackScan(code, { device: meta.p_device_type, os: meta.p_os, browser: meta.p_browser, referrer: meta.p_referer });
          }
        };
        const renderLanding = (p) => {
          document.title = p.title || 'Class Of Learners';
          const link = (label, href, cls) => `<a class="btn ${cls || 'btn-secondary'}" href="${esc(safe(href))}" rel="noopener noreferrer">${esc(label)}</a>`;
          const ic = s => String(s == null ? '' : s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
          const ts = s => (s || '').replace(/[-:]/g, '').replace(/^(\d{8}T\d{4})$/, '$100');
          let body = '', after = null, desc = p.desc || '';
          if (p.t === 'links') {
            body = (p.links || []).slice(0, 30).map(l => link(l.label || l.url, l.url)).join('');
          } else if (p.t === 'app') {
            const store = /iPhone|iPad|iPod/.test(UA) ? p.ios : /Android/.test(UA) ? p.android : '';
            if (store) { window.location.replace(safe(store)); return; }
            body = link('Download on the App Store', p.ios, 'btn-primary') + link('Get it on Google Play', p.android);
          } else if (p.t === 'vcard') {
            body = '<button class="btn btn-primary" id="lpAct">Save contact</button>' + (p.phone ? link('Call ' + p.phone, 'tel:' + p.phone.replace(/[^\d+]/g, '')) : '') + (p.email ? link(p.email, 'mailto:' + p.email) : '') + (p.url ? link(p.url, p.url) : '');
            after = () => { document.getElementById('lpAct').onclick = () => {
              const parts = (p.name || '').trim().split(/\s+/), fam = parts.length > 1 ? parts.pop() : '';
              save((p.name || 'contact') + '.vcf', ['BEGIN:VCARD', 'VERSION:3.0', 'N:' + ic(fam) + ';' + ic(parts.join(' ')) + ';;;', 'FN:' + ic(p.name), p.org && 'ORG:' + ic(p.org), p.role && 'TITLE:' + ic(p.role), p.phone && 'TEL:' + p.phone, p.email && 'EMAIL:' + p.email, p.url && 'URL:' + p.url, p.adr && 'ADR:;;' + ic(p.adr) + ';;;', 'END:VCARD'].filter(Boolean).join('\r\n'), 'text/vcard');
            }; };
          } else if (p.t === 'event') {
            desc = [p.start && new Date(p.start).toLocaleString(), p.loc, p.desc].filter(Boolean).join(' · ');
            body = '<button class="btn btn-primary" id="lpAct">Add to calendar</button>';
            after = () => { document.getElementById('lpAct').onclick = () => save('event.ics', ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Class Of Learners//QR//EN', 'BEGIN:VEVENT', 'UID:' + code + '@col', 'DTSTAMP:' + new Date().toISOString().replace(/[-:]|\.\d+/g, ''), 'DTSTART:' + ts(p.start), p.end && 'DTEND:' + ts(p.end), 'SUMMARY:' + ic(p.title), p.desc && 'DESCRIPTION:' + ic(p.desc), p.loc && 'LOCATION:' + ic(p.loc), 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n'), 'text/calendar'); };
          } else if (p.t === 'coupon') {
            desc = [p.off && p.off + '% off', p.expiry && 'valid until ' + new Date(p.expiry).toLocaleDateString()].filter(Boolean).join(' · ');
            body = '<div class="code">' + esc(p.code) + '</div><button class="btn btn-primary" id="lpAct">Copy code</button>';
            after = () => { document.getElementById('lpAct').onclick = function () { navigator.clipboard.writeText(p.code).then(() => { this.textContent = 'Copied'; }); }; };
          }
          app.innerHTML = `<div class="title">${esc(p.title)}</div><div class="msg">${esc(desc)}</div><div class="stack">${body}</div>`;
          if (after) {after();}
        };
        const go = async (dest) => {
          let target = dest || entry.destination || entry.content;
          if (!target) { renderError(ICONS.warning, 'Empty Destination', 'This QR code has no target link configured.'); return; }
          const page = typeof DYNAMIC_QR !== 'undefined' ? DYNAMIC_QR.decodePayload(target) : null;
          if (page) {
            const now = Date.now();
            const fb = page.fb ? (/^https?:\/\//i.test(page.fb) ? page.fb : 'https://' + page.fb) : null;
            const deny = (icon, title, msg) => { if (fb) { window.location.replace(fb); } else { renderError(icon, title, msg); } };
            const used = entry.scansCount != null ? entry.scansCount : (entry.scans || 0);
            if (page.exp && new Date(page.exp) < now) { deny(ICONS.expired, 'QR Code Expired', 'This dynamic campaign link has reached its expiration date.'); return; }
            if (page.start && new Date(page.start) > now) { deny(ICONS.expired, 'Upcoming Campaign', `This QR code will activate on ${new Date(page.start).toLocaleDateString()}.`); return; }
            if (page.end && new Date(page.end) < now) { deny(ICONS.expired, 'Campaign Ended', `This campaign concluded on ${new Date(page.end).toLocaleDateString()}.`); return; }
            if (page.max && used >= page.max) { deny(ICONS.warning, 'Scan Limit Reached', 'This QR code has reached its maximum number of scans.'); return; }
            await recordScan();
            if (page.t !== 'go') { renderLanding(page); return; }
            // Smart rules: device targeting, A/B rotation, UTM tagging
            target = (/iPhone|iPad|iPod/.test(UA) ? page.ios : /Android/.test(UA) ? page.android : page.desktop) || page.url;
            if (page.ab && page.ab.length) { const pool = [target].concat(page.ab); target = pool[Math.floor(Math.random() * pool.length)]; }
            if (page.utm && !/^(mailto:|tel:|sms:|smsto:|geo:)/i.test(target)) {
              try {
                const u = new URL(/^https?:/i.test(target) ? target : 'https://' + target.replace(/^\/+/, ''));
                [['s', 'source'], ['m', 'medium'], ['c', 'campaign']].forEach(([k, n]) => { if (page.utm[k] && !u.searchParams.has('utm_' + n)) { u.searchParams.set('utm_' + n, page.utm[k]); } });
                target = u.href;
              } catch (e) {}
            }
          } else {
            await recordScan();
          }
          if (/^(WIFI:|BEGIN:)/i.test(target)) {
            app.innerHTML = `<div class="title">Your content</div><div class="msg"></div><div class="code" style="font-size:.85rem;text-align:left;letter-spacing:0;white-space:pre-wrap">${esc(target)}</div>`;
            return;
          }
          if (!/^(https?:|mailto:|tel:|sms:|smsto:|geo:)/i.test(target)) { target = 'https://' + target.replace(/^\/+/, ''); }
          window.location.replace(target);
        };

        // Passcode: new codes carry an AES-encrypted destination (works on any device);
        // legacy codes fall back to the locally stored salted hash.
        const blob = typeof entry.destination === 'string' && entry.destination.indexOf('enc:v1:') === 0 ? entry.destination : null;
        const localHash = entry.isPasswordProtected !== false && (entry.authHash || entry.passwordHash);
        if (!blob && !localHash && entry.isPasswordProtected && fromCloud) {
          renderError(ICONS.locked, 'Protected QR Code', 'This code was locked before cross-device passcodes existed. Ask the owner to re-save it.');
          return;
        }
        if (blob || localHash) {
          app.innerHTML = `
            <div class="icon-container">${ICONS.locked}</div>
            <div class="title">Protected QR Code</div>
            <div class="msg">Enter the passcode to continue.</div>
            <form id="pwdForm">
              <input type="password" class="pwd-input" id="pwdInput" placeholder="Passcode" autocomplete="current-password" aria-label="Passcode" required />
              <div class="err-text" id="errText" role="alert">Incorrect passcode. Please try again.</div>
              <button type="submit" class="btn btn-primary">Unlock &amp; continue</button>
            </form>`;
          const pwdInput = document.getElementById('pwdInput'), errText = document.getElementById('errText');
          document.getElementById('pwdForm').onsubmit = async function (e) {
            e.preventDefault();
            const val = pwdInput.value, btn = this.querySelector('button');
            btn.disabled = true;
            let plain = null, ok = false;
            if (blob) { plain = await DYNAMIC_QR.unlock(blob, val); ok = plain !== null; }
            else { ok = await DYNAMIC_QR.checkPassword(code, val); }
            btn.disabled = false;
            if (ok) {
              app.innerHTML = '<div class="spinner"></div><div class="title">Access verified</div><div class="msg" role="status">Redirecting…</div>';
              go(blob ? plain : undefined);
            } else {
              errText.style.display = 'block';
              pwdInput.value = '';
              pwdInput.focus();
            }
          };
          pwdInput.focus();
          return;
        }

        await go();

      } catch (err) {
        console.error('Redirection error:', err);
        renderError(ICONS.warning, 'Redirect Error', 'Unable to complete redirection. Please try again.');
      }
    });
  </script>
  <script defer src="col-ui.js"></script>
</body>
</html>
