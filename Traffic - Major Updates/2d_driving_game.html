<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoL - 2D Driving</title>
    <style>
        :root {
            --void: #070A14;
            --ink: #E8E3D8;
            --dim: #8891AA;
            --signal: #F2B84B;
            --em: #34D399;
            --panel: #111827;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--void); 
            font-family: 'Space Mono', 'Inter', monospace;
            color: var(--ink);
            touch-action: none; /* Prevent scrolling on mobile */
        }
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: var(--void);
            max-width: 100vw;
            max-height: 100vh;
        }
        
        /* UI Overlay */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        .stat {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 0 0 8px rgba(232, 227, 216, 0.4);
        }
        
        /* Mobile Controls */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            padding: 0 30px;
            justify-content: space-between;
            align-items: flex-end;
            z-index: 20;
        }
        
        @media (max-width: 768px) {
            #mobile-controls { display: flex; }
        }

        /* Steering Wheel / Slider */
        #steering-container {
            width: 200px;
            height: 60px;
            background: rgba(17, 24, 39, 0.8);
            border: 2px solid var(--ink);
            border-radius: 30px;
            position: relative;
            backdrop-filter: blur(4px);
        }
        #steering-knob {
            width: 56px;
            height: 56px;
            background: var(--ink);
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 72px; /* Center */
            box-shadow: 0 0 15px rgba(232, 227, 216, 0.5);
        }

        /* Accelerator Lever */
        #accelerator-container {
            width: 80px;
            height: 150px;
            background: rgba(17, 24, 39, 0.8);
            border: 2px solid var(--signal);
            border-radius: 12px;
            position: relative;
            backdrop-filter: blur(4px);
        }
        #accelerator-pedal {
            width: 100%;
            height: 60px;
            background: var(--signal);
            border-radius: 8px;
            position: absolute;
            bottom: 0;
            left: 0;
            box-shadow: 0 0 15px rgba(242, 184, 75, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--void);
            font-weight: bold;
            font-family: sans-serif;
            font-size: 24px;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--panel);
            border: 2px solid var(--ink);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            display: none;
            z-index: 30;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #game-over h1 { margin-top: 0; color: #ef4444; }
        .btn {
            background: var(--ink);
            color: var(--void);
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            border-radius: 8px;
            margin-top: 20px;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">SCORE: <span id="score">0</span></div>
        <div class="stat">SPEED: <span id="speed">0</span> KM/H</div>
    </div>

    <div id="game-over">
        <h1>CRASHED!</h1>
        <div class="stat">Final Score: <span id="final-score">0</span></div>
        <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Mobile Controls Overlay -->
    <div id="mobile-controls">
        <div id="steering-container">
            <div id="steering-knob"></div>
        </div>
        <div id="accelerator-container">
            <div id="accelerator-pedal">⬆</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const speedEl = document.getElementById('speed');
        const gameOverEl = document.getElementById('game-over');
        const finalScoreEl = document.getElementById('final-score');

        // Responsive Canvas
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Adjust road variables on resize
            roadLeftEdge = (canvas.width - roadWidth) / 2;
        }

        // Colors
        const C_INK = '#E8E3D8'; // The white creme color requested
        const C_DIM = '#8891AA';
        const C_SIGNAL = '#F2B84B';
        const C_EM = '#34D399';
        const C_VOID = '#070A14';
        
        // Road logic
        const laneWidth = 100;
        const numLanes = 3;
        const roadWidth = laneWidth * numLanes;
        let roadLeftEdge = 0; // Set properly in resize()

        // Game State
        let gameActive = true;
        let score = 0;
        let distance = 0;

        // Player Car
        const player = {
            width: 40,
            height: 80,
            x: 0,
            y: 0,
            speed: 0,
            maxSpeed: 15,
            accel: 0.2,
            friction: 0.95,
            turnSpeed: 6,
            color: C_SIGNAL
        };

        window.addEventListener('resize', resize);
        resize(); // Initial resize to setup canvas and roadLeftEdge
        
        player.x = roadLeftEdge + laneWidth + (laneWidth - player.width) / 2;
        player.y = canvas.height - 120;

        let roadOffset = 0;

        // Traffic
        let enemies = [];
        let enemySpawnTimer = 0;

        // Controls
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        let mobileSteer = 0; // -1 to 1
        let mobileAccel = 0; // 0 to 1

        window.addEventListener('keydown', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        // Mobile Control Logic
        const steerContainer = document.getElementById('steering-container');
        const steerKnob = document.getElementById('steering-knob');
        const accelContainer = document.getElementById('accelerator-container');
        const accelPedal = document.getElementById('accelerator-pedal');

        // Steering Touch
        steerContainer.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = steerContainer.getBoundingClientRect();
            const touch = e.touches[0];
            let x = touch.clientX - rect.left - 28; // 28 is half knob width
            if (x < 0) x = 0;
            if (x > rect.width - 56) x = rect.width - 56;
            steerKnob.style.left = x + 'px';
            
            // Map 0 -> rect.width-56 to -1 -> 1
            mobileSteer = ((x / (rect.width - 56)) * 2) - 1;
        }, {passive: false});

        steerContainer.addEventListener('touchend', () => {
            steerKnob.style.left = '72px';
            mobileSteer = 0;
        });

        // Accel Touch
        accelContainer.addEventListener('touchstart', (e) => { e.preventDefault(); mobileAccel = 1; accelPedal.style.bottom = '10px'; accelPedal.style.transform = 'scale(0.9)'; }, {passive: false});
        accelContainer.addEventListener('touchend', () => { mobileAccel = 0; accelPedal.style.bottom = '0px'; accelPedal.style.transform = 'scale(1)'; });

        function spawnEnemy() {
            const lane = Math.floor(Math.random() * numLanes);
            enemies.push({
                x: roadLeftEdge + lane * laneWidth + (laneWidth - 40) / 2,
                y: -100,
                width: 40,
                height: 80,
                speed: Math.random() * 3 + 2, // Slower than player max speed
                color: Math.random() > 0.5 ? C_INK : C_DIM // Using creme and dim colors for enemies
            });
        }

        function resetGame() {
            gameActive = true;
            score = 0;
            distance = 0;
            player.speed = 0;
            player.x = roadLeftEdge + laneWidth + (laneWidth - player.width) / 2;
            enemies = [];
            gameOverEl.style.display = 'none';
            player.y = canvas.height - 120; // reset y in case screen resized
        }

        function drawCar(car) {
            ctx.fillStyle = car.color;
            ctx.shadowBlur = 10;
            ctx.shadowColor = car.color;
            ctx.fillRect(car.x, car.y, car.width, car.height);
            ctx.shadowBlur = 0;

            // Details (creme colored windows)
            ctx.fillStyle = C_VOID;
            ctx.fillRect(car.x + 5, car.y + 15, car.width - 10, 20); // Windshield
            ctx.fillRect(car.x + 5, car.y + car.height - 20, car.width - 10, 10); // Back window
        }

        function drawRoad() {
            // Road background
            ctx.fillStyle = '#0a0d16'; // Slightly lighter than void
            ctx.fillRect(roadLeftEdge, 0, roadWidth, canvas.height);

            // Left/Right boundaries (Creme color lines)
            ctx.fillStyle = C_INK;
            ctx.fillRect(roadLeftEdge - 5, 0, 5, canvas.height);
            ctx.fillRect(roadLeftEdge + roadWidth, 0, 5, canvas.height);

            // Lane markers
            ctx.fillStyle = 'rgba(232, 227, 216, 0.4)'; // Transparent creme
            for (let i = 1; i < numLanes; i++) {
                const laneX = roadLeftEdge + i * laneWidth;
                for (let y = (roadOffset % 80) - 80; y < canvas.height; y += 80) {
                    ctx.fillRect(laneX - 2, y, 4, 40);
                }
            }
        }

        function update() {
            if (!gameActive) return;

            // Input
            let turning = 0;
            if (keys.a || keys.ArrowLeft) turning = -1;
            if (keys.d || keys.ArrowRight) turning = 1;
            if (mobileSteer !== 0) turning = mobileSteer;

            let accelerating = false;
            if (keys.w || keys.ArrowUp || mobileAccel > 0) accelerating = true;

            let braking = false;
            if (keys.s || keys.ArrowDown) braking = true;

            // Physics
            if (accelerating) {
                player.speed += player.accel;
            } else if (braking) {
                player.speed -= player.accel * 2;
            } else {
                player.speed *= player.friction;
            }

            // Clamping speed
            if (player.speed > player.maxSpeed) player.speed = player.maxSpeed;
            if (player.speed < 0) player.speed = 0;

            // Turning (only turn if moving)
            if (player.speed > 0) {
                player.x += turning * player.turnSpeed * (player.speed / player.maxSpeed * 0.8 + 0.2);
            }

            // Clamp to road
            if (player.x < roadLeftEdge) player.x = roadLeftEdge;
            if (player.x + player.width > roadLeftEdge + roadWidth) player.x = roadLeftEdge + roadWidth - player.width;

            // Scrolling road
            roadOffset += player.speed;
            distance += player.speed;

            // Scoring
            if (Math.floor(distance) % 100 === 0) score += Math.floor(player.speed);

            // Enemy spawning (depends on player speed)
            enemySpawnTimer -= player.speed;
            if (enemySpawnTimer <= 0) {
                spawnEnemy();
                enemySpawnTimer = 150 + Math.random() * 200; // Random distance between cars
            }

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                // Enemies move down relative to player speed
                e.y += (player.speed - e.speed);

                // Collision Detection
                if (
                    player.x < e.x + e.width &&
                    player.x + player.width > e.x &&
                    player.y < e.y + e.height &&
                    player.y + player.height > e.y
                ) {
                    // Crash
                    gameActive = false;
                    finalScoreEl.innerText = score;
                    gameOverEl.style.display = 'block';
                }

                // Remove off-screen enemies
                if (e.y > canvas.height) {
                    enemies.splice(i, 1);
                    score += 10; // Bonus for passing
                } else if (e.y < -300) {
                    enemies.splice(i, 1); // Remove if player is too slow and they get far ahead
                }
            }

            // Update UI
            scoreEl.innerText = score;
            speedEl.innerText = Math.floor(player.speed * 10);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawRoad();
            
            // Draw Enemies
            enemies.forEach(e => drawCar(e));
            
            // Draw Player
            drawCar(player);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start
        loop();
    </script>
</body>
</html>
