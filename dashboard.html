<!doctype html>
<html lang="en">
  <head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7939810376745995"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="description" content="View your student progress, achievements, trophy case, and global leaderboard rankings on Class Of Learners." />
    <meta name="google-site-verification" content="bWaer2b60VA1y3RMV48HYGPv8vlMUcvlFGxY3e6SAqU" />
    <link rel="canonical" href="https://advancedlogiclabs.dpdns.org/dashboard" />
    <title>User Dashboard | Class Of Learners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: var(--void, #070A14);
        color: var(--ink, #E8E3D8);
        font-family: var(--sans, 'Inter'), sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      .top-nav {
        position: fixed;
        top: 0; left: 0; width: 100%;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 32px;
        background: var(--nav, rgba(7, 10, 20, 0.8));
        backdrop-filter: blur(18px) saturate(1.4);
        border-bottom: 1px solid var(--line, rgba(255, 255, 255, 0.1));
      }
      .nav-brand { display: flex; align-items: center; gap: 13px; text-decoration: none; }
      .brand-logo { height: 28px; width: auto; border-radius: 8px; }
      .brand-name { font-family: var(--mono, 'Space Mono'); font-size: 0.78rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: var(--ink); }
      .nav-links { display: flex; gap: 18px; align-items: center; }
      .nav-link { color: var(--dim, #8891AA); font-weight: 500; font-size: 0.82rem; text-decoration: none; transition: color 0.25s; }
      .nav-link:hover, .nav-link.act { color: var(--ink); }

      .dashboard-container {
        max-width: 1200px;
        margin: 100px auto 60px;
        padding: 0 32px;
      }
      .user-header {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 24px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line, rgba(255, 255, 255, 0.1));
        border-radius: 32px;
        backdrop-filter: blur(10px);
      }
      .user-avatar {
        width: 80px; height: 80px;
        border-radius: 50%;
        background: var(--signal, #F2B84B);
        color: var(--void, #070A14);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 2rem;
        font-weight: 800;
        overflow: hidden;
        border: 3px solid var(--signal);
      }
      .user-info h1 {
        font-family: var(--serif, 'Instrument Serif');
        font-size: 2.4rem;
        font-weight: 400;
        margin-bottom: 4px;
      }
      .user-info p {
        color: var(--dim, #8891AA);
        font-family: var(--mono, 'Space Mono');
        font-size: 0.8rem;
        letter-spacing: 0.1em;
      }
      .user-role-badge {
        display: inline-block;
        padding: 4px 8px;
        margin-top: 8px;
        background: rgba(242, 184, 75, 0.15);
        color: var(--signal);
        border-radius: 6px;
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        font-family: var(--mono);
      }

      .dash-tabs {
        display: flex;
        gap: 12px;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 12px;
      }
      .dash-tab {
        background: transparent;
        color: var(--dim);
        border: none;
        padding: 8px 16px;
        font-family: var(--mono);
        font-size: 0.85rem;
        text-transform: uppercase;
        font-weight: 700;
        cursor: pointer;
        border-radius: 8px;
        transition: 0.3s;
      }
      .dash-tab:hover {
        background: rgba(255, 255, 255, 0.05);
        color: var(--ink);
      }
      .dash-tab.active {
        background: var(--line);
        color: var(--ink);
      }

      .section-title {
        font-family: var(--serif, 'Instrument Serif');
        font-size: 2rem;
        margin-bottom: 32px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .section-title span {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--signal);
        text-transform: uppercase;
        letter-spacing: 0.3em;
      }

      /* Trophy Case */
      .trophy-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 24px;
        margin-bottom: 80px;
      }
      .trophy-card {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--line, rgba(255, 255, 255, 0.1));
        border-radius: 24px;
        padding: 32px;
        text-align: center;
        transition: 0.4s cubic-bezier(.16,1,.3,1);
        position: relative;
        overflow: hidden;
      }
      .trophy-card.locked {
        filter: grayscale(1);
        opacity: 0.6;
      }
      .trophy-card.unlocked {
        border-color: var(--signal);
        background: rgba(242, 184, 75, 0.03);
      }
      .trophy-card.unlocked:hover {
        transform: translateY(-8px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 20px rgba(242, 184, 75, 0.1);
        border-color: var(--signal);
      }
      .trophy-icon {
        font-size: 3rem;
        margin-bottom: 16px;
        display: block;
      }
      .trophy-name {
        font-family: var(--serif);
        font-size: 1.4rem;
        margin-bottom: 8px;
      }
      .trophy-desc {
        color: var(--dim);
        font-size: 0.85rem;
        margin-bottom: 24px;
        min-height: 2.5rem;
      }
      .btn-share {
        background: var(--signal);
        color: var(--void);
        border: none;
        padding: 10px 20px;
        border-radius: 30px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        transition: 0.3s;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn-share:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px var(--signal);
      }
      .btn-locked {
        background: rgba(255, 255, 255, 0.05);
        color: var(--dim);
        border: 1px solid var(--line);
        padding: 10px 20px;
        border-radius: 30px;
        font-weight: 600;
        font-size: 0.8rem;
        cursor: not-allowed;
      }
      .btn-danger {
        background: #ef4444;
        color: #fff;
        border: none;
        padding: 4px 8px;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.7rem;
        cursor: pointer;
        margin-left: auto;
      }

      /* Leaderboard */
      .leaderboard-wrap {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--line, rgba(255, 255, 255, 0.1));
        border-radius: 32px;
        padding: 32px;
        backdrop-filter: blur(10px);
      }
      .lb-ctrl {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        gap: 16px;
      }
      .lb-select {
        background: var(--void, #070A14);
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 8px 16px;
        border-radius: 12px;
        font-family: var(--mono);
        font-size: 0.75rem;
        outline: none;
        cursor: pointer;
      }
      .lb-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      .lb-table th {
        color: var(--dim);
        font-family: var(--mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      .lb-table td {
        padding: 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        font-size: 0.9rem;
      }
      .lb-rank {
        font-family: var(--mono);
        font-weight: 700;
        color: var(--signal);
        width: 50px;
      }
      .lb-user {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .lb-avatar {
        width: 24px; height: 24px;
        border-radius: 50%;
        background: var(--line);
        overflow: hidden;
      }
      .lb-score {
        text-align: right;
        font-family: var(--mono);
        font-weight: 700;
        color: var(--ion);
      }

      /* Parent Controls */
      .parent-controls {
        margin-bottom: 40px;
        padding: 24px;
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 24px;
      }
      .student-tab {
        background: rgba(255,255,255,0.05);
        border: 1px solid transparent;
        padding: 12px 16px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: 0.2s;
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      .student-tab.active {
        background: rgba(242, 184, 75, 0.1);
        border-color: var(--signal);
        color: var(--signal);
      }
      .student-tab:hover {
        background: rgba(255,255,255,0.1);
      }

      /* Auth Overlay */
      #auth-overlay {
        position: fixed;
        inset: 0;
        background: var(--void);
        z-index: 2000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px;
      }
      .auth-card {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--line);
        padding: 48px;
        border-radius: 32px;
        max-width: 400px;
      }
      .auth-card h2 {
        font-family: var(--serif);
        font-size: 2rem;
        margin-bottom: 16px;
      }
      .auth-card p {
        color: var(--dim);
        margin-bottom: 32px;
      }

      @media (max-width: 768px) {
        .user-header { flex-direction: column; text-align: center; }
        .trophy-grid { grid-template-columns: 1fr; }
        .lb-ctrl { flex-direction: column; align-items: stretch; }
      }
    </style>
    <script defer src="col-router.js"></script>
    <link rel="stylesheet" href="col-ui.css" />
    <script defer src="col-ui.js"></script>
    <script defer src="col-auth.js"></script>
    <script defer src="col-achievements.js"></script>
    <link rel="icon" type="image/png" href="Icon.png" />
  </head>
  <body>
    <nav class="top-nav">
      <a href="/" class="nav-brand">
        <img src="Class.png" alt="Class Of Learners" class="brand-logo" />
        <span class="brand-name">Class Of Learners</span>
      </a>
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="about" class="nav-link">About</a>
        <a href="school" class="nav-link">School</a>
        <div class="nav-user-profile" id="navUserProfile" onclick="openGlobalLogin()">
          <div class="nav-user-avatar" id="navUserAv">?</div>
          <span class="nun" id="navUserName">User</span>
        </div>
      </div>
    </nav>

    <div id="auth-overlay" style="display: none;">
      <div class="auth-card">
        <h2 style="font-family: var(--serif);">Dashboard Locked</h2>
        <p>Please authenticate your account to access your dashboard.</p>
        <button class="btn-share" onclick="window.location.href='/Traffic/TrafficSetup.html'">Sign In Now</button>
      </div>
    </div>

    <div class="dashboard-container" id="dashboard-ui" style="display: none;">
      <header class="user-header" id="user-header">
        <div class="user-avatar" id="user-avatar">?</div>
        <div class="user-info">
          <h1 id="user-name">Loading...</h1>
          <p id="user-email">...</p>
          <div class="user-role-badge" id="user-role-badge">Student</div>
        </div>
      </header>

      <div class="dash-tabs">
        <button class="dash-tab active" id="tab-btn-profile" onclick="switchTab('profile')">Profile</button>
        <button class="dash-tab" id="tab-btn-leaderboard" onclick="switchTab('leaderboard')">Leaderboard</button>
      </div>

      <div id="view-profile">
        
        <!-- Parent/Teacher Controls -->
        <div class="parent-controls" id="parent-controls" style="display:none;">
          <h3 style="font-family: var(--serif); font-size: 1.5rem; margin-bottom: 16px;">Linked Students</h3>
          
          <div id="student-list" style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px;">
            <!-- Student tabs injected here -->
          </div>

          <div style="display: flex; gap: 12px; align-items: center;">
            <input type="text" id="new-student-uid" placeholder="Enter Student UID" style="padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--void); color: var(--ink); font-family: var(--mono); font-size: 0.8rem; min-width: 250px;">
            <button class="btn-share" onclick="linkStudent()">Add Student</button>
          </div>
        </div>

        <section id="profile-trophy-section">
          <h2 class="section-title"><span style="font-family: var(--mono);">01</span> Trophy Case</h2>
          <div class="trophy-grid" id="trophy-grid">
            <!-- Trophies injected here -->
          </div>
        </section>
      </div>

      <div id="view-leaderboard" style="display: none;">
        <section>
          <h2 class="section-title"><span style="font-family: var(--mono);">02</span> Hall of Fame</h2>
          <div class="leaderboard-wrap">
            <div class="lb-ctrl">
              <div style="font-family: var(--mono); font-size: 0.7rem; color: var(--dim); text-transform: uppercase;">Global Rankings</div>
              <select class="lb-select" id="category-select" onchange="loadLeaderboard()">
                <option value="global">Global</option>
                <option value="physics">Physics</option>
                <option value="coding">Coding</option>
                <option value="vision">Vision</option>
                <option value="game-dev">Game Dev</option>
              </select>
            </div>
            <table class="lb-table" id="lb-table">
              <thead>
                <tr>
                  <th class="lb-rank">Rank</th>
                  <th>User</th>
                  <th style="text-align: right;">Score</th>
                </tr>
              </thead>
              <tbody id="lb-body">
                <!-- Rows injected here -->
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </div>

    <script>
      let currentSelectedStudent = null;

      function switchTab(tabId) {
        document.getElementById('view-profile').style.display = tabId === 'profile' ? 'block' : 'none';
        document.getElementById('view-leaderboard').style.display = tabId === 'leaderboard' ? 'block' : 'none';
        
        document.getElementById('tab-btn-profile').classList.toggle('active', tabId === 'profile');
        document.getElementById('tab-btn-leaderboard').classList.toggle('active', tabId === 'leaderboard');
      }

      async function initDashboard() {
        const overlay = document.getElementById('auth-overlay');
        const ui = document.getElementById('dashboard-ui');

        if (!window.colUser) {
          overlay.style.display = 'flex';
          ui.style.display = 'none';
          return;
        }

        overlay.style.display = 'none';
        ui.style.display = 'block';

        document.getElementById('user-name').textContent = window.colUser.name || 'User';
        document.getElementById('user-email').textContent = window.colUser.email || '';
        
        const role = window.colUser.user_metadata?.role || 'student';
        const roleBadge = document.getElementById('user-role-badge');
        roleBadge.textContent = role === 'parent_teacher' ? 'Parent / Teacher' : role.charAt(0).toUpperCase() + role.slice(1);
        
        const av = document.getElementById('user-avatar');
        if (window.colUser.picture) {
          av.innerHTML = `<img src="${window.colUser.picture}" style="width:100%; height:100%; object-fit:cover;">`;
        } else {
          av.textContent = (window.colUser.name || 'U').charAt(0).toUpperCase();
        }

        if (role === 'parent' || role === 'teacher' || role === 'parent_teacher') {
          document.getElementById('parent-controls').style.display = 'block';
          await renderLinkedStudents();
        } else {
          document.getElementById('parent-controls').style.display = 'none';
          await loadTrophiesForCurrentUser();
        }

        await loadLeaderboard();
      }

      async function renderLinkedStudents() {
        const list = document.getElementById('student-list');
        const linked = window.colUser.user_metadata?.linked_students || [];
        
        list.innerHTML = '';
        
        if (linked.length === 0) {
          list.innerHTML = '<span style="color:var(--dim); font-size:0.9rem;">No students linked yet. Enter a UID below to link one.</span>';
          document.getElementById('trophy-grid').innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--dim);">Add a student to view their progress.</div>';
          return;
        }

        if (!currentSelectedStudent || !linked.includes(currentSelectedStudent)) {
          currentSelectedStudent = linked[0];
        }

        linked.forEach(uid => {
          const btn = document.createElement('div');
          btn.className = `student-tab ${uid === currentSelectedStudent ? 'active' : ''}`;
          btn.innerHTML = `
            <span>UID: ${uid.substring(0, 8)}...</span>
            <button class="btn-danger" onclick="removeStudent('${uid}'); event.stopPropagation();">Remove</button>
          `;
          btn.onclick = () => {
            currentSelectedStudent = uid;
            renderLinkedStudents();
          };
          list.appendChild(btn);
        });

        await loadTrophiesForStudent(currentSelectedStudent);
      }

      async function linkStudent() {
        const uid = document.getElementById('new-student-uid').value.trim();
        if (!uid) return;

        // Basic UUID format validation
        const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        if (!uuidRegex.test(uid)) {
          alert('Please enter a valid Student UID (UUID format).');
          return;
        }

        let linked = window.colUser.user_metadata?.linked_students || [];
        if (linked.includes(uid)) {
          alert('Student is already linked.');
          return;
        }

        linked.push(uid);

        const { data, error } = await window.supabaseClient.auth.updateUser({
          data: { linked_students: linked }
        });

        if (error) {
          alert('Error linking student: ' + error.message);
        } else {
          window.colUser = data.user;
          document.getElementById('new-student-uid').value = '';
          currentSelectedStudent = uid;
          await renderLinkedStudents();
        }
      }

      async function removeStudent(uid) {
        if (!confirm('Are you sure you want to remove this student?')) return;

        let linked = window.colUser.user_metadata?.linked_students || [];
        linked = linked.filter(id => id !== uid);

        const { data, error } = await window.supabaseClient.auth.updateUser({
          data: { linked_students: linked }
        });

        if (error) {
          alert('Error removing student: ' + error.message);
        } else {
          window.colUser = data.user;
          await renderLinkedStudents();
        }
      }

      async function loadTrophiesForCurrentUser() {
        const grid = document.getElementById('trophy-grid');
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--dim);">Loading trophies...</div>';

        const { data, error } = await window.getUserProgress();
        renderTrophies(data, error, grid);
      }

      async function loadTrophiesForStudent(uid) {
        const grid = document.getElementById('trophy-grid');
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--dim);">Loading student trophies...</div>';

        if (!uid) return;

        // Uses the RPC function added in Supabase to fetch achievements for the linked student UUID
        // We chain the select to also get the achievement definitions
        const { data, error } = await window.supabaseClient
          .rpc('get_linked_student_achievements', { student_uids: [uid] })
          .select('*, achievement_definitions(*)');

        renderTrophies(data, error, grid);
      }

      function renderTrophies(data, error, grid) {
        if (error) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ef4444;">Error loading progress: ${error.message}</div>`;
          return;
        }

        grid.innerHTML = '';
        if (!data || data.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--dim);">No achievements found.</div>';
          return;
        }

        data.forEach(item => {
          const def = item.achievement_definitions;
          if (!def) return; // safety check
          const isCompleted = item.is_completed;

          const card = document.createElement('div');
          card.className = `trophy-card ${isCompleted ? 'unlocked' : 'locked'}`;

          card.innerHTML = `
            <span class="trophy-icon">${def.icon || '🏆'}</span>
            <h3 class="trophy-name">${def.name}</h3>
            <p class="trophy-desc">${def.description}</p>
            ${isCompleted
              ? `<button class="btn-share" onclick="shareAchievement('${def.slug}', '${item.token}')">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                  Share
                </button>`
              : `<button class="btn-locked">Locked</button>`
            }
          `;
          grid.appendChild(card);
        });
      }

      async function loadLeaderboard() {
        const body = document.getElementById('lb-body');
        const cat = document.getElementById('category-select').value;

        body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--dim);">Updating ranks...</td></tr>';

        let { data, error } = cat === 'global'
          ? await window.getGlobalLeaderboard()
          : await window.getCategoryLeaderboard(cat);

        if (error) {
          body.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ef4444;">Error loading leaderboard: ${error.message}</td></tr>`;
          return;
        }

        body.innerHTML = '';
        if (!data || data.length === 0) {
          body.innerHTML = '<tr><td colspan="3" style="text-align:center; color:var(--dim);">No rankings available yet.</td></tr>';
          return;
        }

        data.forEach((entry, idx) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="lb-rank">${idx + 1}</td>
            <td>
              <div class="lb-user">
                <div class="lb-avatar">${entry.avatar_url ? `<img src="${entry.avatar_url}" style="width:100%; height:100%; object-fit:cover;">` : ''}</div>
                <span>${entry.username || entry.name || entry.full_name || 'Anonymous'}</span>
              </div>
            </td>
            <td class="lb-score">${entry.score || entry.total_score || 0}</td>
          `;
          body.appendChild(row);
        });
      }

      function shareAchievement(slug, token) {
        const url = window.location.origin + '/verify?cert=' + slug + '&token=' + token;

        if (navigator.share) {
          navigator.share({
            title: 'I earned an achievement!',
            text: 'Check out my achievement on Class Of Learners!',
            url: url
          }).catch(err => {
            copyToClipboard(url);
          });
        } else {
          copyToClipboard(url);
        }
      }

      function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
          const toast = document.getElementById('toast') || createToast();
          toast.textContent = 'Verification link copied to clipboard!';
          toast.className = 'toast show green';
          setTimeout(() => { toast.className = 'toast'; }, 3000);
        });
      }

      function createToast() {
        const toast = document.createElement('div');
        toast.id = 'toast';
        toast.className = 'toast';
        document.body.appendChild(toast);
        return toast;
      }

      window.addEventListener('col-auth-changed', () => {
        initDashboard();
      });

      window.addEventListener('DOMContentLoaded', () => {
        // Only init if supabaseClient is ready, otherwise wait for event
        if (window.supabaseClient && window.colUser) {
          initDashboard();
        }
      });
    </script>
  </body>
</html>
