<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, follow" />
  <meta name="description" content="The requested Class Of Learners page could not be found." />
  <title>Page Not Found | Class Of Learners</title>
  <link rel="icon" type="image/png" href="/Icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #070a14;
      --panel: #111827;
      --line: rgba(255,255,255,.12);
      --text: #f4efe4;
      --muted: #a6aec4;
      --accent: #f2b84b;
    }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 20%, #17213a 0%, var(--bg) 52%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(100%, 560px);
      padding: clamp(28px, 7vw, 56px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(17,24,39,.78);
      box-shadow: 0 28px 80px rgba(0,0,0,.38);
      text-align: center;
    }
    img { width: 88px; height: 88px; margin: 0 auto 24px; }
    .code {
      margin: 0;
      color: var(--accent);
      font: 800 0.78rem/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 { margin: 12px 0 14px; font-size: clamp(2rem, 9vw, 3.6rem); line-height: 1; }
    p { margin: 0 auto 28px; max-width: 42ch; color: var(--muted); line-height: 1.7; }
    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    a {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      font-weight: 800;
      text-decoration: none;
    }
    a.primary { border-color: var(--accent); background: var(--accent); color: #0a0800; }
    @media (max-width: 420px) {
      main { border-radius: 22px; }
      .actions { flex-direction: column; }
      a { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/Class.png" alt="Class Of Learners" width="88" height="88" />
    <p class="code">Error 404</p>
    <h1>Page Not Found</h1>
    <p>The page may have moved, been renamed, or never existed. Return to the studio hub to keep exploring.</p>
    <div class="actions">
      <a class="primary" href="/">Return Home</a>
      <a href="/sitemap">View Sitemap</a>
    </div>
  </main>
  <script defer src="col-ui.js"></script>
</body>
</html>
